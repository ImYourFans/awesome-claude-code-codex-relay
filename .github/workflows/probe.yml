name: probe
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe all providers
        env:
          PROBE_VANTAGE: github-actions-us
          KEY_TEAMOROUTER: ${{ secrets.KEY_TEAMOROUTER }}
        run: python3 scripts/probe.py
      - name: Rebuild README tables
        run: python3 scripts/build_readme.py
      - name: Commit results
        run: |
          git config user.name "relay-probe[bot]"
          git config user.email "relay-probe@users.noreply.github.com"
          git add data README.md README.en.md
          git diff --cached --quiet || git commit -m "probe: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase --autostash origin main
          git push
